<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Instantly</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #111;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus {
            border-color: #0066cc;
        }
        button {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #0066cc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0052a3;
        }
        .description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-top: 15px;
        }
        #result {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
            word-break: break-all;
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .download-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Download Instantly</h1>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="Paste video link here..." required>
            <button id="downloadBtn" onclick="handleDownload()">Download</button>
        </div>

        <p class="description">
            Paste your video link above and click download to get your media instantly. Works seamlessly across mobile and desktop devices.
        </p>

        <div id="result"></div>
    </div>

    <script>
        async function handleDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!url) {
                alert('Please enter a valid URL first.');
                return;
            }

            resultDiv.innerHTML = "Processing request...";

            try {
                // REPLACE THIS with your deployed Cloudflare Worker URL
                const workerUrl = 'https://your-worker-subdomain.workers.dev/?url=' + encodeURIComponent(url);
                
                const response = await fetch(workerUrl);
                const data = await response.json();

                if (data.downloadUrl) {
                    resultDiv.innerHTML = `
                        <p><strong>Ready!</strong></p>
                        <a class="download-link" href="${data.downloadUrl}" target="_blank">Download File</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<span style="color: red;">Could not fetch video. Check the link.</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span style="color: red;">An error occurred while connecting to the server.</span>`;
            }
        }
    </script>

</body>
</html>
