<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Instantly</title>
<style>
  :root{--bg:#fff;--fg:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#16a34a;--accent-h:#15803d;--card:#f9fafb;--err:#dc2626}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--fg:#f3f4f6;--muted:#9ca3af;--line:#1f2937;--card:#111827;--accent:#22c55e;--accent-h:#16a34a;--err:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{width:100%;max-width:640px;text-align:center}
  h1{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:-.03em;margin:0 0 12px;font-weight:800}
  h1 span{color:var(--accent)}
  p.desc{color:var(--muted);margin:0 auto 32px;max-width:480px;line-height:1.6}
  .box{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
  input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:1rem;padding:12px 14px;outline:none}
  button{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;padding:12px 24px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--accent-h)}
  button:disabled{opacity:.6;cursor:wait}
  #out{margin-top:20px;min-height:24px}
  #out a.dl{display:inline-block;margin:4px;padding:10px 20px;border-radius:10px;background:var(--card);border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:600}
  #out a.dl:hover{background:var(--accent);color:#fff}
  .err{color:var(--err)}
  .note{margin-top:40px;font-size:.8rem;color:var(--muted)}
  @media(max-width:480px){.box{flex-direction:column}}
</style>
</head>
<body>
<main>
  <h1><span>Download</span> Instantly</h1>
  <p class="desc">Paste a video link, press download, and save it to your device. Fast, free, and no sign-up.</p>

  <div class="box">
    <input id="url" type="url" placeholder="Paste video link here…" autocomplete="off" autofocus>
    <button id="go">Download</button>
  </div>
  <div id="out" aria-live="polite"></div>

  <p class="note">Only download content you own or have permission to save.</p>
</main>

<script>
/* ========= CONFIG =========
   GitHub Pages is static, so a backend does the real extraction.
   Point API_URL at a cobalt-compatible API (e.g. your own self-hosted instance).
   Do NOT put a secret API key here: anything in this file is public. */
const API_URL = "";   // e.g. "https://api.yourdomain.com/"
const API_KEY = "";   // optional; leave empty for your own CORS-restricted instance
/* ========================= */

const $ = id => document.getElementById(id);
const out = $("out"), btn = $("go"), input = $("url");

function msg(text, isErr){ out.innerHTML = ""; const d = document.createElement("div"); d.textContent = text; if(isErr) d.className = "err"; out.appendChild(d); }
function link(href, label){ const a = document.createElement("a"); a.className = "dl"; a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label; a.setAttribute("download", ""); return a; }

async function run(){
  const url = input.value.trim();
  if(!/^https?:\/\//i.test(url)) return msg("Please paste a valid link starting with http(s)://", true);
  if(!API_URL) return msg("Backend not configured yet. Set API_URL in index.html.", true);

  btn.disabled = true; msg("Fetching…");
  try{
    const headers = {"Accept":"application/json","Content-Type":"application/json"};
    if(API_KEY) headers.Authorization = "Api-Key " + API_KEY;
    const r = await fetch(API_URL, {method:"POST", headers, body: JSON.stringify({url})});
    const d = await r.json();

    if(d.status === "error") return msg("Could not download: " + (d.error && d.error.code || "unknown error"), true);
    out.innerHTML = "";
    if(d.status === "tunnel" || d.status === "redirect" || d.status === "stream"){
      out.appendChild(link(d.url, "Download " + (d.filename || "file")));
    } else if(d.status === "picker"){
      d.picker.forEach((p,i) => out.appendChild(link(p.url, "Download " + (p.type || "item") + " " + (i+1))));
      if(d.audio) out.appendChild(link(d.audio, "Download audio"));
    } else msg("Unexpected response from server.", true);
  }catch(e){
    msg("Request failed. Check your API_URL and that the server allows this site (CORS).", true);
  }finally{ btn.disabled = false; }
}

btn.addEventListener("click", run);
input.addEventListener("keydown", e => { if(e.key === "Enter") run(); });
</script>
</body>
</html>
